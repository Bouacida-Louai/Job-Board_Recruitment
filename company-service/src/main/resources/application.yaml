spring:
  application:
    name: company-service
  config:
    import: configserver:http://localhost:8888
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 5
        initial-interval: 2000
        max-interval: 5000
        multiplier: 1.5
  jackson:
    serialization:
      write-dates-as-timestamps: false