server:
  port: 8082

spring:
  application:
    name: company-service
  datasource:
    url: jdbc:mysql://localhost:3307/company_db
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cache:
    type: redis
  data:
    redis:
      time-to-live: 600000
  jackson:
    serialization:
      write-dates-as-timestamps: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true